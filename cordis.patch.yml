# dsh-hmos-emulator bundle patch
#
# 挂载宿主行(loader 在 profile 启动时合并本文件)。
# 客户端 bundle 由 profile 的 dsh.profile.bundles 列表加载(见 README 安装步骤)。
#
# 可选 row config(按需取消注释;未配置时宿主自动探测 devecocli/hdc):
# - insert:
#     - id: hmos-emulator
#       name: dsh-hmos-emulator
#       config:
#         # devecocli 的 node CLI 入口(默认自动探测 npm 全局 @deveco/deveco-cli)
#         devecoCliJs: <devecocli 的 node CLI 入口路径>
#         # DevEco Studio SDK 根目录(默认读取环境变量 DEVECO_SDK_HOME)
#         sdkHome: <DevEco Studio SDK 根路径>
- insert:
    - id: hmos-emulator
      name: dsh-hmos-emulator
