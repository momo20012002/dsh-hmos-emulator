name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      # These majors are the ones that run on node24; the older pins run on node20, which GitHub retires.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (src → lib)
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test

  # What a consumer installs is the manifest's publication view, not the working tree: this job packs
  # the package and checks that every declared entry (main, types, exports, files) resolves.
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (src → lib)
        run: pnpm build

      - name: Check the published package
        run: pnpm lint:package

  # One check to require in a branch rule: a job added later is not enforced until it is listed here.
  gate:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: echo "build and package passed"
